# The recipe's router flags, but its --model-path, which a8.py appends as the model it serves; the
# HTTP router runs over instances that a8.py gives --api-server-count 4 instead of a gRPC server.
[[router]]
name = "http"
prefill = ["p0", "p1", "p2"]
decode = ["d0", "d1", "d2", "d3"]
grpc = false
args = [
    "--dp-aware", "--prefill-policy", "cache_aware", "--decode-policy", "cache_aware",
    "--cache-threshold", "1.0", "--balance-abs-threshold", "0", "--balance-rel-threshold", "1.0",
    "--atom-pd-rank-mapping-policy", "none", "--backend", "atom", "--disable-circuit-breaker",
    "--request-timeout-secs", "1800", "--prepare-queue-timeout-ms", "5000",
    "--prepare-timeout-ms", "15000",
]

[[router]]
name = "grpc"
prefill = ["p0", "p1", "p2"]
decode = ["d0", "d1", "d2", "d3"]
args = [
    "--dp-aware", "--prefill-policy", "cache_aware", "--decode-policy", "cache_aware",
    "--cache-threshold", "1.0", "--balance-abs-threshold", "0", "--balance-rel-threshold", "1.0",
    "--atom-pd-rank-mapping-policy", "none", "--backend", "atom", "--disable-circuit-breaker",
    "--request-timeout-secs", "1800", "--prepare-queue-timeout-ms", "5000",
    "--prepare-timeout-ms", "15000",
]

[[router]]
name = "session"
prefill = ["p0", "p1", "p2"]
decode = ["d0", "d1", "d2", "d3"]
args = [
    "--dp-aware", "--prefill-policy", "cache_aware", "--decode-policy", "cache_aware",
    "--cache-threshold", "1.0", "--balance-abs-threshold", "0", "--balance-rel-threshold", "1.0",
    "--atom-pd-rank-mapping-policy", "none", "--backend", "atom", "--disable-circuit-breaker",
    "--request-timeout-secs", "1800", "--prepare-queue-timeout-ms", "5000",
    "--prepare-timeout-ms", "15000", "--atom-grpc-session",
]
