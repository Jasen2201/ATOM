# Two fake instances with MTP, each behind its own atomesh: "think", whose prompt opens a
# reasoning channel atomesh reads with deepseek_r1's parser, and "plain", all content.

[[instance]]
name = "think"
model = "../fixtures/deepseek_v3_mtp"
args = [
    "--method", "mtp", "--num-speculative-tokens", "3",
    # the fixture's template, its generation prompt opening a reasoning channel
    "--chat-template", """\
{{ bos_token }}{% for message in messages %}{% if message['role'] == 'user' %}\
<|user|>{{ message['content'] }}{% elif message['role'] == 'assistant' %}\
<|assistant|>{{ message['content'] }}{{ eos_token }}{% else %}{{ message['content'] }}\
{% endif %}{% endfor %}{% if add_generation_prompt %}<|assistant|><think>{% endif %}""",
]
fake = { acceptance_length = 3.51 }
grpc = true

[[instance]]
name = "plain"
model = "../fixtures/deepseek_v3_mtp"
args = ["--method", "mtp", "--num-speculative-tokens", "3"]
fake = { acceptance_length = 3.51 }
grpc = true

[[router]]
name = "think-mesh"
workers = ["think"]
args = ["--reasoning-parser", "deepseek_r1"]

[[router]]
name = "plain-mesh"
workers = ["plain"]
