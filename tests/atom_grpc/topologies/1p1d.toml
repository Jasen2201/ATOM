# One P, chunking its transfers, and one D (DP 2) over fake Mooncake, and atomesh P/D over
# their HTTP servers and over their gRPC servers; P's handshake port names only its socket.

[[instance]]
name = "p"
model = "../fixtures/deepseek_v3_mtp"
args = [
    "--method", "mtp", "--num-speculative-tokens", "3",
    "--cudagraph-capture-sizes", "[1,2,4]", "--max-num-seqs", "4",  # the law's decode rungs
    "--kv-transfer-config",
    '{"kv_connector": "mooncake", "kv_role": "kv_producer", "enable_chunked_transfer": true}',
]
grpc = true

[instance.fake]
law = "tests/atom_grpc/fixtures/laws/test.json"  # from the repository root: a long prefill takes seconds
num_kvcache_blocks = 2304  # below D's pool: P refuses a prompt that D takes
block_bytes = 2_000_000  # a block moves in 2 ms
bandwidth_gb_s = 1.0
transfer_timeout_s = 6.0

[[instance]]
name = "d"
model = "../fixtures/deepseek_v3_mtp"
args = [
    "-tp", "2", "--enable-dp-attention", "--method", "mtp", "--num-speculative-tokens", "3",
    "--kv-transfer-config", '{"kv_connector": "mooncake", "kv_role": "kv_consumer"}',
]
dp = 2
grpc = true

[instance.fake]
acceptance_length = 3.51
step_s = 0.001
# Rank 1 fails receives of prompts starting [3, 3, 3]; every rank fails those starting
# "zo zo zo" and times out "zu zu zu": atomesh replaces D's params, so no request tags one.
faults = [
    { fault = "fail", dp_rank = 1, prompt_prefix = [3, 3, 3] },
    { fault = "fail", prompt_prefix = [106, 106, 106] },
    { fault = "timeout", prompt_prefix = [107, 107, 107] },
]
env = { ATOM_PD_FAILED_WRITE_HOLD_S = "2" }

[[router]]
name = "http"
prefill = ["p"]
decode = ["d"]
grpc = false
args = ["--backend", "atom"]  # ATOM's flow in atomesh's HTTP P/D router

[[router]]
name = "grpc"
prefill = ["p"]
decode = ["d"]
