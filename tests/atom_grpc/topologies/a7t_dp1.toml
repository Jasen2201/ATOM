# One fake instance with MTP stepping every 16.5 ms, its KV room for 1024 requests of 1K prompt and 4096
# output tokens, its API server on one core and its rank on another; atomesh over its Session, its
# preparation queue deep enough for 1024 requests at once.

[[instance]]
name = "dp1"
model = "../fixtures/deepseek_v3_mtp"
args = ["--method", "mtp", "--num-speculative-tokens", "3", "--max-num-seqs", "1024"]
fake = { acceptance_length = 3.51, step_s = 0.0165, num_kvcache_blocks = 340_000 }
cores = { front_end = 1, rank = 1 }
grpc = true

[[router]]
name = "mesh"
workers = ["dp1"]
args = ["--atom-grpc-session", "--json-log", "--prepare-queue-capacity", "1024"]
