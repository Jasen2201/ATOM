# The C1228 recipe's 3P x DP2 + 4D x DP4 in relay on fake engines (recipes/DeepSeek-V4.1-6P16D-
# C1228-Share-Cache.md on ROCm/ATOM branch lirzhang/recipe-6p16d-c1228-share-cache-20261117): its
# instance and router flags, P balanced with least_requests, without its Mooncake Store tier. A8 runs
# one router at a time, under the law, on the AgentX trace's model files (timing/a8.py).

# P: the recipe's P command. Mooncake's RDMA and proxy fields have no fake counterpart; the handshake
# port names each rank's fake socket. A rank's link moves 10 GB/s, its instance's two 20 GB/s.
# 369920 is a block's bytes (128 tokens, bf16 KV, fp8 index): `block_bytes` in a V4.1-Flash P's
# startup log at these flags. 524288 blocks hold 64 prompts of max_model_len (1048576 tokens) a rank.
[[instance]]
name = "p0"
model = "../fixtures/deepseek_v3_mtp"
args = [
    "-tp", "2", "--enable-dp-attention", "--dp-load-balance", "least_requests",
    "--gpu-memory-utilization", "0.85", "--max-num-seqs", "64", "--max-num-batched-tokens", "32768",
    "--attn-prefill-chunk-size", "65536", "--cudagraph-capture-sizes", "[1,2,4,8,16,24,32,40,48,64]",
    "--trust-remote-code", "--moe-backend", "standard", "--all2all-backend", "none",
    "--kv_cache_dtype", "bf16", "--index-cache-dtype", "fp8", "--enable_prefix_caching",
    "--block-size", "128", "--state-checkpoint-interval-tokens", "8192", "--level", "3",
    "--cudagraph-mode", "FULL", "--method", "dspark", "--num-speculative-tokens", "5",
    "--tool-call-parser", "dsml_v41", "--dspark-config", '{"confidence_schedule":false}',
    "--disable-uvicorn-access-log", "--kv-transfer-config",
    '{"kv_connector": "mooncake", "kv_role": "kv_producer", "handshake_port": 17300}',
]
fake = { block_bytes = 369920, bandwidth_gb_s = 10.0, num_kvcache_blocks = 524288, env = { ATOM_FRONTEND_PREFIX_HASH = "1", ATOM_DP_SESSION_AFFINITY = "0" } }
dp = 2
cores = { front_end = 5, rank = 1 }
grpc = true

