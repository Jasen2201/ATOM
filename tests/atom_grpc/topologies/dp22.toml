    '{"kv_connector": "mooncake", "kv_role": "kv_producer", "handshake_port": 17320}',
]
fake = { block_bytes = 1_000_000 }
dp = 2
grpc = true

[[instance]]
name = "d0"
model = "../fixtures/deepseek_v3_mtp"
args = [
    "-tp", "4", "--enable-dp-attention",
    "--kv-transfer-config", '{"kv_connector": "mooncake", "kv_role": "kv_consumer"}',
]
fake = {}
dp = 4
